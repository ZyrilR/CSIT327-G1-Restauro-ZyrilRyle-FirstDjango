{% extends "base.html" %}

{% block title %}CampusConnect - Profile{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 520px;">
    <div class="card-body p-4 p-sm-5">
        <h2 class="h4 fw-bold mb-1">Edit your profile</h2>
        <p class="text-muted mb-4">Keep your details up to date.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2 mt-2">
                <a href="{% url 'dashboard' %}" class="btn btn-light w-50 py-2">Back to Dashboard</a>
                <button type="submit" class="btn btn-primary w-50 py-2">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
