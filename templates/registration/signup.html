{% extends "base.html" %}

{% block title %}CampusConnect - Sign Up{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 520px;">
    <div class="card-body p-4 p-sm-5">
        <h2 class="h4 fw-bold mb-1">Create your account</h2>
        <p class="text-muted mb-4">Join Campus Connect in a minute.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Sign Up</button>
        </form>
        <p class="mt-4 mb-0 text-center small text-muted">Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</div>
{% endblock %}

{% block footer %}Copyright by CIT-U{% endblock %}
