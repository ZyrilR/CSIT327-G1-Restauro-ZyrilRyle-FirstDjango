{% extends "base.html" %}

{% block content %}
<div class="card mx-auto" style="max-width: 420px;">
    <div class="card-body p-4 p-sm-5">
        <h2 class="h4 fw-bold mb-1">Welcome back</h2>
        <p class="text-muted mb-4">Log in to your account.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Login</button>
        </form>
        <p class="mt-4 mb-0 text-center small text-muted">No account? <a href="{% url 'signup' %}">Sign Up</a></p>
    </div>
</div>
{% endblock %}
